<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Systems Mapping is a local-first concept and resource mapping application." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <title>Systems Mapping</title>
    <script>
      try {
        if (localStorage.getItem('systems-mapping.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#141919');
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to workspace</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
