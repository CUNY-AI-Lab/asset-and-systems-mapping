name: Systems Mapping checks
on:
  pull_request:
  workflow_call:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
concurrency:
  group: systems-mapping-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cail_test
          POSTGRES_PASSWORD: cail_test
          POSTGRES_DB: cail_systems_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cail_test -d cail_systems_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@cuny-ai-lab'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm check:cloudflare
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
        env:
          TEST_POSTGRES_URL: postgresql://cail_test:cail_test@127.0.0.1:5432/cail_systems_test
          SYSTEMS_MAPPING_BROWSER_ACCEPTANCE: '1'
      - name: Preserve the existing Node browser and accessibility paths
        run: pnpm test:e2e
      - name: Package the checked Cloudflare Worker and assets
        run: |
          # Fail rather than omit a new runtime sidecar from this single-file bundle.
          test -z "$(find .wrangler/dry-run -type f ! -path .wrangler/dry-run/worker.js ! -path .wrangler/dry-run/worker.js.map ! -path .wrangler/dry-run/README.md -print -quit)"
          mkdir -p .wrangler/release-package
          cp .wrangler/dry-run/worker.js wrangler.jsonc pnpm-lock.yaml .wrangler/release-package/
          cp -R dist-cloudflare .wrangler/release-package/
          git rev-parse HEAD > .wrangler/release-package/SOURCE_SHA
          git rev-parse 'HEAD^{tree}' > .wrangler/release-package/SOURCE_TREE
          cd .wrangler/release-package
          find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: systems-mapping-cloudflare-${{ github.sha }}
          path: .wrangler/release-package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
